# /etc/nginx/sites-available/api.ithouseedu.uz.conf
#
# Backend: Django/DRF running in Docker (gunicorn), published on 127.0.0.1:3130
# (see docker-compose.yml: "${PORT}:${PORT}" with PORT=3130 in .env).
#
# Static files (/static/) are served by WhiteNoise inside gunicorn in production
# (see core/settings.py MIDDLEWARE + INSTALLED_APPS when DEBUG=False), so nginx
# just proxies them like any other request.
#
# Media files (/media/) are NOT served by Django in production (core/urls.py only
# wires up static(MEDIA_URL, ...) when DEBUG=True), so nginx serves them directly
# from the host-mounted ./media directory (bind-mounted in docker-compose.yml).

# Rate limiting zones (shared across reloads, sized for a small/medium API)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# Connection limiting to blunt basic abuse / slowloris-style clients
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream ithouseedu_backend {
    server 127.0.0.1:3130;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP - only for ACME challenge + redirect to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ithouseedu.uz;

    # Cert issuance/renewal uses the nginx authenticator plugin
    # (certbot certonly --nginx), which patches this block temporarily
    # during the challenge — no static webroot needed. Matches convention
    # used by the other vhosts on this host (api.infodesk.uz, etc).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ithouseedu.uz;

    # --- TLS (paths created by: certbot certonly --nginx -d api.ithouseedu.uz) ---
    ssl_certificate     /etc/letsencrypt/live/api.ithouseedu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ithouseedu.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    client_max_body_size 20M;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    access_log /var/log/nginx/api.ithouseedu.uz.access.log;
    error_log  /var/log/nginx/api.ithouseedu.uz.error.log warn;

    # Block access to dotfiles (.env, .git, etc.) if ever placed under docroot
    location ~ /\. {
        deny all;
    }

    # --- Media: served directly by nginx (Django doesn't serve it in prod) ---
    location /media/ {
        alias /home/ubuntu/projects/IthouseEduProject/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Auth endpoints: tighter rate limit against brute force ---
    location ~ ^/(token/|admin-page-locked/login/) {
        limit_req zone=api_auth burst=10 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://ithouseedu_backend;
        include /etc/nginx/proxy_params_ithouseedu.conf;
    }

    # --- Everything else: API, admin, static (via WhiteNoise), swagger ---
    location / {
        limit_req zone=api_general burst=30 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://ithouseedu_backend;
        include /etc/nginx/proxy_params_ithouseedu.conf;
    }
}
