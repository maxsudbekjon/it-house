# Temporary bootstrap config — HTTP only, used ONCE to obtain the first
# TLS certificate via `certbot certonly --nginx`, since the real
# api.ithouseedu.uz.conf references a certificate that doesn't exist yet
# (nginx refuses to even test/reload a config pointing at a missing cert file).
#
# Usage:
#   sudo cp deploy/nginx/api.ithouseedu.uz.bootstrap.conf /etc/nginx/sites-available/api.ithouseedu.uz.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --nginx -d api.ithouseedu.uz
#   sudo cp deploy/nginx/api.ithouseedu.uz.conf /etc/nginx/sites-available/api.ithouseedu.uz.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.ithouseedu.uz;

    location / {
        return 301 https://$host$request_uri;
    }
}
